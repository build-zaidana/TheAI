function foot(el,items,sel){el.innerHTML=items.map((x,i)=>`<div class="${i===sel?'sel':''}"><div class="fl">${x[0]}</div><div class="fv" style="margin-top:2px">${x[1]}</div></div>`).join('')}
function curve(pts){let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;for(let i=1;i<pts.length;i++){const m=(pts[i-1][0]+pts[i][0])/2;d+=` C${m.toFixed(1)} ${pts[i-1][1].toFixed(1)} ${m.toFixed(1)} ${pts[i][1].toFixed(1)} ${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)}`}return d}
function noise(x,seed){return Math.sin(x*.9+seed)*.5+Math.sin(x*2.3+seed*2)*.28+Math.sin(x*5.1+seed*3)*.16}

function drawSys(t,sc){
 const p=seg(t,sc.a+1.9,sc.a+2.4),warn=p>0;

 const cpu=Math.round(23+6*noise(t*1.2,1));const mem=(9.1+3.8*ease(p)).toFixed(1);
 const col=warn?'#FF453A':'#F5F5F7';
 $('sys-val').textContent=warn?mem:String(cpu);$('sys-val').style.color=col;
 $('sys-unit').textContent=warn?'GB':'%';
 $('sys-unit').style.left=(13+$('sys-val').offsetWidth+4)+'px';
 const W=404,H=72,n=42,step=W/(n-1),scroll=(t*1.6)%1;const pts=[];
 for(let i=0;i<=n;i++){const x=(i-scroll)*step;const k=Math.floor(t*1.6)+i;

 const yEnd=last[1]+(pts[pts.length-1][1]-last[1])*(1-scroll)*0;

function ruler(el,value,clock){
 const W=420,per=10,mid=W/2;let s='';
 for(let m=Math.floor(value-22);m<=Math.ceil(value+22);m++){
  if(!clock&&(m<0||m>180))continue;
  const x=mid+(m-value)*per,f=clamp(Math.min(x,W-x)/(W*.18));if(f<=0)continue;

  s+=`<line x1="${x.toFixed(1)}" y1="8" x2="${x.toFixed(1)}" y2="${major?28:18}" stroke="${major?'#8E8E93':'#48484A'}" stroke-width="${major?1.6:1.2}" stroke-linecap="round" opacity="${f.toFixed(2)}"/>`;

}

 foot($('tm-foot'),[[T.timer,`5 ${T.min}`],[T.pomo,`25 ${T.min}`],[T.watch,'0:00'],[T.alarm,T.type],[T.shutdown,`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`]],4);

function drawAgent(t,sc){
 const done=t>sc.a+3.1;
 $('ag-title').textContent=done?T.done:T.work;
 $('ag-time').textContent=done?'0:58':`${T.ran} 0:${String(Math.min(57,41+Math.floor((t-sc.a)*5))).padStart(2,'0')}`;
 let h='';const show=[sc.a+.8,sc.a+1.5,sc.a+2.2];
 T.steps.forEach((s,i)=>{const o=clamp((t-show[i])/.25);if(o<=0)return;
  const running=i===2&&!done;
  const mark=running?`<svg width="16" height="16" style="position:absolute;left:0;top:12px;transform:rotate(${(t*360)%360}deg)"><circle cx="8" cy="8" r="6.5" fill="none" stroke="#3A3A3C" stroke-width="2.2"/><path d="M8 1.5 A6.5 6.5 0 0 1 14.5 8" fill="none" stroke="#F5F5F7" stroke-width="2.2" stroke-linecap="round"/></svg>`
   :`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7C7C80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:1px;top:13px"><path d="M20 6 9 17l-5-5"/></svg>`;
  h+=`<div class="row" style="top:${112+i*40}px;opacity:${o};transform:translateY(${(1-o)*6}px)">${mark}<b>${s}</b><i>${i===2&&done?'18 s':T.ago[i]}</i></div>`});
 $('ag-rows').innerHTML=h;

function drawAsk(t,sc){
 $('ask-kind').textContent=T.kind;$('ask-wait').textContent=T.wait;$('ask-title').textContent=T.ask;
 $('ask-b1').textContent=T.b1;$('ask-b2').textContent=T.b2;$('ask-b3').textContent=T.b3;

}
function drawClip(t,sc){
 $('cl-label').textContent=T.latest;
 const o=spring(seg(t,sc.a+1,sc.a+1.7));const swapped=t>sc.a+1;
 $('cl-meta').textContent=swapped?T.src:T.srcOld;
 $('cl-title').textContent=swapped?T.clip1:T.clip2;
 $('cl-sub').textContent=swapped?T.clip1s:'github.com';
 const items=[[T.clip2,'link',T.m14],[T.clip3,'#FF9F0A',T.h1],[T.clip4,'term',T.h2]];
 const list=swapped?items:items.slice(1).concat([['','','']]);
 const dy=swapped?(1-clamp(o))*-40:0;
 let h='<div style="position:absolute;left:0;top:112px;width:420px;height:120px;overflow:hidden">';
 list.forEach((x,i)=>{if(!x[0])return;const y=i*40+dy;
  const mk=x[1].startsWith('#')?`<span style="position:absolute;left:0;top:12px;width:16px;height:16px;border-radius:5px;background:${x[1]}"></span>`
   :x[1]==='link'?`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7C7C80" stroke-width="2" stroke-linecap="round" style="position:absolute;left:0;top:12px"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>`
   :`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7C7C80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:0;top:12px"><path d="m4 17 6-6-6-6M12 19h8"/></svg>`;
  h+=`<div class="row" style="top:${y}px">${mk}<b style="${x[1]==='term'?"font-family:'Cascadia Mono',Consolas,monospace;font-size:13px":''}">${x[0]}</b><i>${x[2]}</i></div>`});
 $('cl-rows').innerHTML=h+'</div>';
}
function drawMusic(t,sc){
 $('mu-label').textContent=T.playing;$('mu-l1').textContent=T.gone;$('mu-l2').textContent=T.left;
 const prog=.2+.34*ease(seg(t,sc.a+.3,sc.b));const secs=Math.round(prog*233);
 const f=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
 $('mu-v1').textContent=f(secs);$('mu-v2').textContent=f(233-secs);
 let s='';const n=65;
 for(let i=0;i<n;i++){const played=i<prog*n;let h=10+40*Math.abs(Math.sin(i*.47)*Math.cos(i*.19+1))+((i*37)&7);
  if(played)h*=.78+.22*Math.sin(t*5+i*1.7);
  s+=`<rect x="${i*6}" y="${(32-h/2).toFixed(1)}" width="3" height="${h.toFixed(1)}" rx="1.5" fill="${played?'#F5F5F7':'#3A3A3C'}"/>`}
 $('mu-svg').innerHTML=s;
}
const TILES=['<path d="M12 20h.01M2 8.82a15 15 0 0 1 20 0M5 12.86a10 10 0 0 1 14 0M8.5 16.43a5 5 0 0 1 7 0"/>','<path d="m7 7 10 10-5 5V2l5 5L7 17"/>','<path d="M2 2l20 20"/><path d="M18.9 13.2A7 7 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.3V5a3 3 0 0 0-5.7-1.3"/><path d="M9 9v3a3 3 0 0 0 5.1 2.1"/><path d="M12 19v3"/>','<path d="M10 2h4M12 14l3-3"/><circle cx="12" cy="14" r="8"/>','<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/>','<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>','<path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/><rect x="9" y="2" width="6" height="4" rx="1"/>','<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>'];
function drawCtl(t,sc){
 $('ct-label').textContent=T.ctl;$('ct-meta').textContent=T.batt;$('ct-title').textContent=T.net;$('ct-sub').textContent=T.netS;
 const gap=(388-8*40)/7;let h='';
 TILES.forEach((p,i)=>{const on=i<2;h+=`<div class="btn" style="left:${16+i*(40+gap)}px;top:112px;background:${on?'#F5F5F7':'#1C1C1E'}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${on?'#000':'#F5F5F7'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg></div>`});
 $('ct-tiles').innerHTML=h;
 const vol=.3+.42*ease(seg(t,sc.a+.4,sc.a+1.5)),bri=.25+.5*ease(seg(t,sc.a+.8,sc.a+2));
 const W=388,hh=32;let s=`<defs><clipPath id="c1"><rect width="${W}" height="${hh}" rx="16"/></clipPath><clipPath id="c2"><rect y="40" width="${W}" height="${hh}" rx="16"/></clipPath></defs>`;
 const bar=(y,v,col,clip,ic)=>{const x=W*v;let e='';const wl=44,amp=4,ph=(t*22)%wl;
  e+=`<rect y="${y}" width="${W}" height="${hh}" fill="#1C1C1E" clip-path="url(#${clip})"/>`;
  let d=`M-10 ${y-wl} H${x} `;for(let k=0;k<5;k++){d+=`q${amp} ${wl/4} 0 ${wl/2} q${-amp} ${wl/4} 0 ${wl/2} `}d+=`H-10 Z`;
  e+=`<g clip-path="url(#${clip})"><path d="${d}" fill="${col}" transform="translate(0 ${-ph})"/></g>`;
  e+=`<text x="${W-16}" y="${y+21}" text-anchor="end" font-family="Segoe UI" font-weight="700" font-size="15" fill="#fff">${Math.round(v*100)}</text>`;
  e+=`<g transform="translate(14 ${y+7})" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="scale(.75)">${ic}</g></g>`;return e};
 s+=bar(0,vol,'#F5F5F7','c1','<path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z"/><path d="M16 9a5 5 0 0 1 0 6"/>');
 s+=bar(40,bri,'#FFEDBE','c2','<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>');
 $('ct-svg').innerHTML=s;

const DRAW={agent:drawAgent,ask:drawAsk,sys:drawSys,timer:drawTimer,off:drawOff,clip:drawClip,music:drawMusic,ctl:drawCtl};

function render(t){
 let i=SCENES.findIndex(s=>t>=s.a&&t<s.b);if(i<0)i=SCENES.length-1;
 const sc=SCENES[i],prev=SCENES[Math.max(0,i-1)];
 const k=i===0?1:spring(seg(t,sc.a,sc.a+.7));
 const w=prev.w+(sc.w-prev.w)*k,h=prev.h+(sc.h-prev.h)*k,r=prev.r+(sc.r-prev.r)*k;
 const isl=$('island');
 isl.style.width=(w*S)+'px';isl.style.height=(h*S)+'px';isl.style.marginLeft=(-w*S/2)+'px';
 isl.style.borderRadius=V?`${r*S}px`:`0 0 ${r*S}px ${r*S}px`;
 $('pages').style.transform=`translateX(${(w-420)*S/2}px) scale(${S})`;
 // the eyes rest in the pill and step aside as a page opens
 const openness=clamp((h-32)/60);
 $('eyes').style.opacity=1-clamp(openness*2.5);
 // pages cross-fade
 const show=sc.id?PAGE[sc.id]:null;
 document.querySelectorAll('.page').forEach(p=>{
  const fadeOut=i>0&&prev.id&&PAGE[prev.id]===p.id&&show!==p.id?1-seg(t,sc.a,sc.a+.18):0;
  const fadeIn=show===p.id?seg(t,sc.a+(prev.id?.12:.22),sc.a+(prev.id?.36:.5)):0;
  p.style.opacity=Math.max(fadeOut,fadeIn);
 });
 if(sc.id)DRAW[sc.id](t,sc);
 if(i>0&&prev.id&&(sc.id===null||PAGE[prev.id]!==PAGE[sc.id])&&t<sc.a+.2)DRAW[prev.id](t,prev);
 // captions: in with a small rise, out before the next scene
 const inn=ease(seg(t,sc.a+.25,sc.a+.7)),out=1-ease(seg(t,sc.b-.3,sc.b-.05));const op=sc.c?inn*out:0;
 const cap=$('cap'),sub=$('sub');
 cap.textContent=sc.c?T[sc.c]:'';sub.textContent=sc.s?T[sc.s]:'';
 cap.style.opacity=op;sub.style.opacity=op*.95;
 cap.style.transform=`translateY(${(1-inn)*18}px)`;sub.style.transform=`translateY(${(1-inn)*24}px)`;
 if(V)sub.style.top=(1030+cap.offsetHeight+22)+'px';   // a caption may wrap to two lines here
 // outro
 const oo=ease(seg(t,29.6,30.3));
 $('outro').style.opacity=oo;$('outro').style.transform=`translateY(${(1-oo)*20}px)`;
 $('o1').textContent=T.o1;$('o2').textContent=T.o2;$('o3').textContent=T.o3;
 return true;
}
window.render=render;window.DURATION=DURATION;render(0);
